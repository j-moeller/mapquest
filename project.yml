# Xcode project specification for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Generate the project with:  xcodegen generate
# The generated project is not committed: changes made in Xcode are lost when it is
# generated again. Bundle ID prefix and development team belong in
# App/Config/Local.xcconfig (git-ignored; see Local.xcconfig.example).
name: MapQuest
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  MapQuestKit:
    path: MapQuestKit
targets:
  MapQuest:
    type: application
    platform: iOS
    configFiles:
      Debug: App/Config/MapQuest.xcconfig
      Release: App/Config/MapQuest.xcconfig
    sources:
      - path: App/MapQuest
    # Location simulation for the iOS Simulator (Product › Scheme › Edit Scheme › Run › Options).
    fileGroups:
      - App/Simulation
    dependencies:
      - package: MapQuestKit
        products:
          - MapQuestCore
          - MapQuestSQLite
          - MapQuestRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MQ_BUNDLE_ID_PREFIX).MapQuest
        PRODUCT_NAME: MapQuest
        INFOPLIST_FILE: App/MapQuest/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  MapQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: App/Config/MapQuest.xcconfig
      Release: App/Config/MapQuest.xcconfig
    sources:
      - path: App/MapQuestUITests
    dependencies:
      - target: MapQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MQ_BUNDLE_ID_PREFIX).MapQuestUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MapQuest
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  MapQuest:
    build:
      targets:
        MapQuest: all
        MapQuestUITests: [test]
    test:
      config: Debug
      targets:
        - MapQuestUITests
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: App/Simulation/BerlinWalk.gpx
    archive:
      config: Release
