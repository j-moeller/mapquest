name: UI smoke test (iPhone 13 mini)

# Launches the app in an iPhone 13 mini simulator, walks through the main
# screens (App/MapQuestUITests) and prints downscaled screenshots as base64
# between MQSHOT markers, so they can be inspected from the log.
# Manual only (macOS runner minutes).

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Create and boot an iPhone 13 mini simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(sorted(r, key=lambda x: [int(p) for p in x['version'].split('.')])[-1]['identifier'])")
          echo "runtime: $RUNTIME"
          DEVICE=$(xcrun simctl create "MapQuest 13 mini" com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$RUNTIME")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # Alexanderplatz; location permission granted up front.
          xcrun simctl location "$DEVICE" set 52.52190,13.41320
          xcrun simctl privacy "$DEVICE" grant location-always com.example.MapQuest
      - name: Run the smoke test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MapQuest.xcodeproj -scheme MapQuest \
            -destination "id=$DEVICE" \
            -resultBundlePath Smoke.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case|\*\* TEST|XCTAssert" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path Smoke.xcresult --output-path shots || true
          ls -la shots
          for f in shots/*.png; do
            [ -e "$f" ] || continue
            name=$(python3 -c "import json,sys; m=json.load(open('shots/manifest.json')); print(next((a['suggestedHumanReadableName'] for t in m for a in t['attachments'] if a['exportedFileName']=='$(basename "$f")'), '$(basename "$f")'))" 2>/dev/null || basename "$f")
            sips -s format jpeg -s formatOptions 55 -Z 760 "$f" --out shot.jpg >/dev/null
            echo "MQSHOT-BEGIN $name"
            base64 -i shot.jpg | fold -w 3000
            echo "MQSHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke
          path: |
            shots
            test.log
          retention-days: 14
