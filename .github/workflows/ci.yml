name: CI

on:
  push:
    paths:
      - "MapQuestKit/**"
      - "App/**"
      - "project.yml"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: MapQuestKit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: MapQuestKit
        run: swift test

  app-ios:
    name: iOS app build (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      - name: Package tests on macOS
        working-directory: MapQuestKit
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project MapQuest.xcodeproj \
            -scheme MapQuest \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Check bundled resources
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/MapQuest.app" -maxdepth 6 -type d | head -1)
          echo "$APP"
          ls -la "$APP" | grep -E "berlin|demo" || true
          for f in berlin-boundary.geojson berlin-districts.geojson demo-walks.json; do test -e "$APP/$f" || { echo "missing $f"; exit 1; }; done
