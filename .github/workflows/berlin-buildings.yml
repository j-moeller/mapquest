name: Berlin building data

# Builds the LoD1 building database for the 3D line-of-sight layer:
# OpenStreetMap footprints (Geofabrik Berlin extract) with heights from Berlin's
# official LoD2 building models where available. Publishes the database as an
# artifact; a manual run with "commit" set also commits the compressed database
# to App/MapQuest/Resources/Berlin/berlin-buildings.sqlite.deflate on the branch.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the compressed database to the branch"
        type: boolean
        default: false
  push:
    paths:
      - "Tools/berlin/extract_buildings.py"
      - "Tools/berlin/extract_lod2.py"
      - "Tools/berlin/apply_lod2_heights.py"
      - "MapQuestKit/Sources/MapQuestImport/**"
      - "MapQuestKit/Sources/MapQuestSQLite/BuildingImporter.swift"
      - ".github/workflows/berlin-buildings.yml"

permissions:
  contents: write

jobs:
  buildings:
    name: Build berlin-buildings.sqlite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3
          python3 -m venv .venv
          .venv/bin/pip install osmium lxml pyproj shapely numpy
      - name: Download the Berlin OpenStreetMap extract (Geofabrik)
        run: |
          curl -fsSL -o berlin.osm.pbf https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf
          ls -la berlin.osm.pbf
      - name: Extract OSM buildings
        run: .venv/bin/python Tools/berlin/extract_buildings.py berlin.osm.pbf buildings.jsonl
      - name: Extract LoD2 heights (Geoportal Berlin)
        run: .venv/bin/python Tools/berlin/extract_lod2.py --cache lod2-cache lod2.jsonl
      - name: Apply LoD2 heights to the OSM buildings
        run: .venv/bin/python Tools/berlin/apply_lod2_heights.py buildings.jsonl lod2.jsonl buildings-lod2.jsonl
      - name: Build the database
        working-directory: MapQuestKit
        run: |
          swift run -c release mapquest-import buildings \
            --output ../berlin-buildings.sqlite \
            --complete-inside ../App/MapQuest/Resources/Berlin/berlin-boundary.geojson \
            --source "OpenStreetMap contributors (ODbL), Geofabrik extract of $(date -u +%F); heights: LoD2 Berlin (dl-de/zero-2-0)" \
            ../buildings-lod2.jsonl
      - name: Statistics
        run: |
          echo "Heights by source (0 = OSM height tag, 1 = OSM levels, 2 = estimated, 3 = LoD2 measured):"
          sqlite3 -header -column berlin-buildings.sqlite \
            "SELECT height_source, COUNT(*) AS buildings, ROUND(AVG(height), 1) AS avg_height FROM buildings GROUP BY height_source;"
          echo "Tallest named buildings:"
          sqlite3 -header -column berlin-buildings.sqlite \
            "SELECT name, height, height_source FROM buildings WHERE name IS NOT NULL ORDER BY height DESC LIMIT 10;"
          sqlite3 berlin-buildings.sqlite "SELECT COUNT(*) || ' complete zoom-14 tiles' FROM downloaded_tiles;"
          ls -la berlin-buildings.sqlite
      - name: Viewshed check on real buildings
        working-directory: MapQuestKit
        run: |
          swift run -c release mapquest-import viewshed --database ../berlin-buildings.sqlite \
            "Alexanderplatz (street)@52.52190,13.41320" \
            "Unter den Linden (street)@52.51700,13.38880" \
            "Kreuzberg side street@52.49720,13.42190" \
            "Tempelhofer Feld@52.47400,13.40300" \
            "Fernsehturm viewing deck@52.52082,13.40940,238" \
            "Park Inn rooftop (125 m)@52.52310,13.41290,160"
      - name: Compress for the app bundle
        run: |
          python3 -c "
          import zlib
          data = open('berlin-buildings.sqlite', 'rb').read()
          c = zlib.compressobj(9, zlib.DEFLATED, -15)  # raw DEFLATE, as expected by NSData.decompressed(using: .zlib)
          packed = c.compress(data) + c.flush()
          open('berlin-buildings.sqlite.deflate', 'wb').write(packed)
          print(f'{len(data) / 1e6:.1f} MB -> {len(packed) / 1e6:.1f} MB')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: berlin-buildings
          path: berlin-buildings.sqlite
          retention-days: 90
      - name: Commit the compressed database
        if: github.event_name == 'workflow_dispatch' && inputs.commit
        run: |
          # The branch may have moved on while the job ran: commit on top of its current tip.
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout -B bundled-buildings FETCH_HEAD
          cp berlin-buildings.sqlite.deflate App/MapQuest/Resources/Berlin/berlin-buildings.sqlite.deflate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/MapQuest/Resources/Berlin/berlin-buildings.sqlite.deflate
          git commit -m "Update the bundled Berlin building database" \
            -m "Built by the 'Berlin building data' workflow (run ${{ github.run_id }}) from the Geofabrik OpenStreetMap extract with heights from Berlin's LoD2 models."
          git push origin HEAD:${{ github.ref_name }}
