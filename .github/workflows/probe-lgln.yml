name: Probe LGLN open data

# Temporary: discovers the download URLs of Lower Saxony's open geodata
# (LGLN OpenGeoData: LoD2 buildings, DGM1 terrain) for the Braunschweig data
# pipeline. Prints what it finds; changes nothing.

on:
  push:
    paths:
      - ".github/workflows/probe-lgln.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bucket listings around Braunschweig (UTM32 E 595-615 km, N 5780-5800 km)
        run: |
          set +e
          for prefix in LoD2_32_604_5792 LoD2_32_60 ; do
            echo "== lod2 prefix $prefix"
            curl -s -m 30 "https://lod2.s3.eu-de.cloud-object-storage.appdomain.cloud/?prefix=$prefix&max-keys=30" | grep -oE "<Key>[^<]+</Key><LastModified>[^<]+</LastModified><ETag>[^<]+</ETag><Size>[0-9]+" | head -30
          done
          echo "== lod2 first keys"
          curl -s -m 30 "https://lod2.s3.eu-de.cloud-object-storage.appdomain.cloud/?max-keys=15" | grep -oE "<Key>[^<]+</Key>" | head -15
          echo "== dgm1 first keys"
          curl -s -m 30 "https://dgm1.s3.eu-de.cloud-object-storage.appdomain.cloud/?max-keys=30" | grep -oE "<Key>[^<]+</Key><LastModified>[^<]+</LastModified><ETag>[^<]+</ETag><Size>[0-9]+" | head -30
      - name: Download indices
        run: |
          set +e
          for kind in lod2 dgm1 dgm dgm5 dom1; do
            url="https://single-datasets.opengeodata.lgln.niedersachsen.de/pro-download-indices/$kind/lgln-opengeodata-$kind.geojson"
            code=$(curl -s -o index.json -m 60 -w "%{http_code}" "$url")
            echo "== $code $url $(wc -c < index.json) bytes"
            if [ "$code" = 200 ]; then
              python3 - <<'PY'
          import json
          d = json.load(open("index.json"))
          feats = d.get("features", [])
          print(len(feats), "features; first properties:", json.dumps(feats[0]["properties"])[:800] if feats else None)
          near = [f["properties"] for f in feats if any(k in json.dumps(f["properties"]) for k in ("604_5792", "604_5793", "6045792"))]
          print("Braunschweig centre tile:", json.dumps(near)[:1500])
          PY
            fi
          done
