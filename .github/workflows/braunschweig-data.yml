name: Braunschweig data

# Builds the bundled data for Braunschweig (docs/06-braunschweig-data.md):
# outline and districts (OpenStreetMap), buildings (OpenStreetMap footprints
# with heights from LGLN's LoD2 models) and the terrain model (LGLN DGM1).
# LoD2 heights and terrain are best effort: without them the buildings keep
# their OSM heights and the city has no terrain model. A manual run with
# "commit" set commits the results to App/MapQuest/Resources/Braunschweig.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the data to the branch"
        type: boolean
        default: false
  push:
    paths:
      - "Tools/cities/**"
      - ".github/workflows/braunschweig-data.yml"

permissions:
  contents: write

jobs:
  data:
    name: Build the Braunschweig data
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT: App/MapQuest/Resources/Braunschweig
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3 osmium-tool
          python3 -m venv .venv
          .venv/bin/pip install osmium lxml pyproj shapely numpy rasterio
      - name: Download the Lower Saxony OpenStreetMap extract (Geofabrik) and cut out Braunschweig
        run: |
          curl -fsSL -o niedersachsen.osm.pbf https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf
          osmium extract --strategy smart -S types=boundary,multipolygon -b 10.30,52.12,10.75,52.42 niedersachsen.osm.pbf -o braunschweig.osm.pbf
          rm niedersachsen.osm.pbf
          ls -la braunschweig.osm.pbf
      - name: Outline and districts (OSM)
        run: |
          .venv/bin/python Tools/cities/extract_osm_areas.py braunschweig.osm.pbf \
            --name Braunschweig --id braunschweig --admin-level 6 --district-levels 9,10 --out "$OUT"
      - name: OSM buildings
        run: .venv/bin/python Tools/berlin/extract_buildings.py braunschweig.osm.pbf buildings.jsonl
      - name: LoD2 heights (LGLN)
        continue-on-error: true
        run: .venv/bin/python Tools/cities/lgln_lod2.py --boundary "$OUT/braunschweig-boundary.geojson" --cache lod2-cache lod2.jsonl
      - name: Apply LoD2 heights
        run: |
          if [ -s lod2.jsonl ]; then
            .venv/bin/python Tools/berlin/apply_lod2_heights.py buildings.jsonl lod2.jsonl buildings-final.jsonl
            echo "SOURCE=OpenStreetMap contributors (ODbL), Geofabrik extract of $(date -u +%F); heights: LoD2 LGLN Niedersachsen (dl-de/by-2-0)" >> "$GITHUB_ENV"
          else
            cp buildings.jsonl buildings-final.jsonl
            echo "SOURCE=OpenStreetMap contributors (ODbL), Geofabrik extract of $(date -u +%F)" >> "$GITHUB_ENV"
          fi
      - name: Build the database
        working-directory: MapQuestKit
        run: |
          swift run -c release mapquest-import buildings \
            --output ../braunschweig-buildings.sqlite \
            --complete-inside "../$OUT/braunschweig-boundary.geojson" \
            --source "$SOURCE" \
            ../buildings-final.jsonl
      - name: Statistics
        run: |
          sqlite3 -header -column braunschweig-buildings.sqlite \
            "SELECT height_source, COUNT(*) AS buildings, ROUND(AVG(height), 1) AS avg_height FROM buildings GROUP BY height_source;"
          sqlite3 -header -column braunschweig-buildings.sqlite \
            "SELECT name, height, height_source FROM buildings WHERE name IS NOT NULL ORDER BY height DESC LIMIT 10;"
          sqlite3 braunschweig-buildings.sqlite "SELECT COUNT(*) || ' complete zoom-14 tiles' FROM downloaded_tiles;"
          ls -la braunschweig-buildings.sqlite
      - name: Terrain (LGLN DGM1)
        continue-on-error: true
        run: .venv/bin/python Tools/cities/lgln_terrain.py --boundary "$OUT/braunschweig-boundary.geojson" --cache dgm-cache "$OUT/braunschweig-terrain.dem"
      - name: Viewshed check on real buildings
        working-directory: MapQuestKit
        run: |
          swift run -c release mapquest-import viewshed --database ../braunschweig-buildings.sqlite \
            "Burgplatz (street)@52.26420,10.52360" \
            "Altstadtmarkt (street)@52.26230,10.51670" \
            "Schlossplatz (street)@52.26370,10.52810" \
            "Hauptbahnhof forecourt@52.25240,10.53970"
      - name: Compress for the app bundle
        run: |
          python3 -c "
          import zlib
          data = open('braunschweig-buildings.sqlite', 'rb').read()
          c = zlib.compressobj(9, zlib.DEFLATED, -15)  # raw DEFLATE, as expected by NSData.decompressed(using: .zlib)
          packed = c.compress(data) + c.flush()
          open('$OUT/braunschweig-buildings.sqlite.deflate', 'wb').write(packed)
          print(f'{len(data) / 1e6:.1f} MB -> {len(packed) / 1e6:.1f} MB')
          "
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: braunschweig-data
          path: App/MapQuest/Resources/Braunschweig
          retention-days: 90
      - name: Commit the data
        if: github.event_name == 'workflow_dispatch' && inputs.commit
        run: |
          mkdir -p /tmp/out && cp "$OUT"/* /tmp/out/
          # The branch may have moved on while the job ran: commit on top of its current tip.
          git fetch --depth=1 origin "${{ github.ref_name }}"
          git checkout -B braunschweig-data FETCH_HEAD
          mkdir -p "$OUT" && cp /tmp/out/* "$OUT"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Add the Braunschweig data (outline, districts, buildings, terrain)" \
            -m "Built by the 'Braunschweig data' workflow (run ${{ github.run_id }}): OpenStreetMap (ODbL) via Geofabrik; LoD2 heights and DGM1 terrain from LGLN Niedersachsen OpenGeoData (dl-de/by-2-0)."
          git push origin HEAD:${{ github.ref_name }}
